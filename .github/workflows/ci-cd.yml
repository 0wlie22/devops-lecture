name: Java CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile sources
        run: |
          mkdir -p build/classes
          javac -d build/classes src/main/java/com/lecture/App.java

      - name: Create jar
        run: |
          jar --create --file build/hello-world-app.jar --main-class com.lecture.App -C build/classes .

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/hello-world-app.jar

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download jar artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: build

      - name: Compile and run tests
        run: |
          mkdir -p build/test-classes
          javac -cp build/hello-world-app.jar -d build/test-classes src/test/java/com/lecture/AppTest.java
          java -cp build/hello-world-app.jar:build/test-classes com.lecture.AppTest

  docker-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download jar artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: build

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/hello-world-app" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: docker-image
    permissions:
      contents: read
      pages: write
      id-token: write
      deployments: write
    environment:
      name: github-pages
      url: ${{ steps.pages_deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Pages source is GitHub Actions
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data } = await github.rest.repos.getPages({
                owner: context.repo.owner,
                repo: context.repo.repo
              });

              core.info(`Current Pages build type: ${data.build_type}`);

              if (data.build_type !== 'workflow') {
                core.setFailed('GitHub Pages source is not set to GitHub Actions. Go to Settings > Pages and set Source to GitHub Actions.');
              }
            } catch (error) {
              core.setFailed(`GitHub Pages is not enabled yet. Open Settings > Pages, set Source to GitHub Actions, then rerun workflow. Details: ${error.message}`);
            }

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download jar artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: build

      - name: Generate static page
        run: |
          mkdir -p public
          APP_OUTPUT="$(java -jar build/hello-world-app.jar)"
          APP_OUTPUT="$APP_OUTPUT" python - <<'PY'
          import os
          from pathlib import Path

          template = Path("site/index.html").read_text(encoding="utf-8")
          output = template.replace("{{APP_OUTPUT}}", os.environ["APP_OUTPUT"])
          Path("public/index.html").write_text(output, encoding="utf-8")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: pages_deployment
        uses: actions/deploy-pages@v4

      - name: Create GitHub deployment status for GHCR
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'ghcr',
              required_contexts: [],
              auto_merge: false,
              description: 'Deployed Docker image to GitHub Container Registry'
            });

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment: 'ghcr',
              log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'Docker image pushed to GHCR successfully'
            });
