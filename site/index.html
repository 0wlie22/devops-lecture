<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello from Java</title>
    <style>
      :root {
        --bg-top: #edf6f9;
        --bg-bottom: #e9f5db;
        --text: #14213d;
        --surface: #ffffff;
        --accent: #1d3557;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        color: var(--text);
        background: linear-gradient(140deg, var(--bg-top), var(--bg-bottom));
        display: grid;
        place-items: center;
        padding: 1rem;
      }

      main {
        width: min(700px, 100%);
        text-align: center;
        background: var(--surface);
        border-radius: 16px;
        padding: 2rem 1.2rem;
        border: 1px solid rgba(20, 33, 61, 0.12);
      }

      .message {
        margin: 0;
        font-size: clamp(2rem, 6vw, 3rem);
        font-weight: 700;
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="message">{{APP_OUTPUT}}</p>
    </main>
  </body>
</html>
